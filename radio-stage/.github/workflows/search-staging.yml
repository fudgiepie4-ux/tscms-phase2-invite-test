name: TSCMS Search Archive Staging
on:
  pull_request:
    paths:
      - 'scripts/build-search-archive.cjs'
      - 'scripts/test-search-archive.cjs'
      - 'tscms-search.js'
      - 'tscms-search.html'
      - 'tscms-search.css'
      - '.github/workflows/search-staging.yml'
  workflow_dispatch:
jobs:
  search-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read staged source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test verified-song seed and rolling archive
        run: node scripts/test-search-archive.cjs
