name: TSCMS Town Journal STAGING checks
on:
  pull_request:
    paths:
      - 'town-journal.html'
      - 'tscms-quick-jump.js'
      - 'town-journal-assets/**'
      - 'town-journal-sources/**'
      - 'town-journal-content-source.json'
      - 'scripts/test-town-journal-staging.cjs'
      - '.github/workflows/town-journal-staging.yml'
jobs:
  manuscript-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-town-journal-staging.cjs
