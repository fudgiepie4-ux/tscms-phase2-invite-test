name: TSCMS Public Legibility Staging
on:
  pull_request:
    paths:
      - 'tscms-legibility.js'
      - 'tscms-legibility.css'
      - 'scripts/test-public-legibility.cjs'
      - 'index.html'
      - 'tscms-today.html'
      - 'gamehouse.html'
      - 'videos.html'
      - 'public-redesign.html'
      - '.github/workflows/public-legibility-staging.yml'
  workflow_dispatch:
jobs:
  legibility-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test legibility baseline, toggle, protected pages
        run: node scripts/test-public-legibility.cjs
