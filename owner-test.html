<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSCMS Owner Sign-in Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2em auto; padding: 0 1em; }
  input { display: block; width: 100%; margin: .5em 0; padding: .6em; font-size: 1em; box-sizing: border-box; }
  button { display: block; width: 100%; margin: .5em 0; padding: .7em; font-size: 1em; cursor: pointer; }
  #status { white-space: pre-wrap; background: #f4f4f4; padding: 1em; margin-top: 1em; border-radius: 8px; font-size: .9em; }
  .ok { color: green; font-weight: bold; } .bad { color: crimson; font-weight: bold; }
</style>
</head>
<body>
<h2>TSCMS Owner Sign-in Test</h2>
<p>Sign in with your email + password. This page is for testing only — it touches nothing else.</p>
<input id="email" type="email" value="fudgiepie4@gmail.com" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="signin">Sign in</button>
<button id="sendverify" disabled>Send verification email</button>
<button id="refresh" disabled>Refresh my status</button>
<button id="sendtest">Send test email (password reset)</button>
<div id="status">Not signed in.</div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDHKa7_wmD6fOiwv9mNKk0hmVXRlNkMJC0",
  authDomain: "tscms-admin-login-test.firebaseapp.com",
  projectId: "tscms-admin-login-test",
  storageBucket: "tscms-admin-login-test.firebasestorage.app",
  messagingSenderId: "723244835526",
  appId: "1:723244835526:web:5c0562d7e5d4887b04edc7"
});
var auth = firebase.auth();
var db = firebase.firestore();
var out = document.getElementById('status');
var sv = document.getElementById('sendverify');
var rf = document.getElementById('refresh');

function show() {
  var u = auth.currentUser;
  if (!u) { out.textContent = "Not signed in."; return; }
  sv.disabled = false; rf.disabled = false;
  var verified = u.emailVerified;
  var text =
    "Signed in: " + u.email + "\n" +
    "UID: " + u.uid + "\n" +
    "Email verified: " + (verified ? "YES" : "NO") + "\n";
  out.textContent = text + "\nChecking Owner permissions…";
  if (!verified) {
    out.innerHTML =
      "Signed in: " + u.email + "\nUID: " + u.uid + "\n" +
      "Email verified: <span class='bad'>NO</span>\n\n" +
      "Tap 'Send verification email', check Gmail (and spam), click the link, then tap 'Refresh my status'.";
    return;
  }
  // Force a fresh token so the verified claim is current, then attempt the
  // Owner-only read: listing the users collection (v4 rules: list = owner only).
  u.getIdToken(true).then(function() {
    return db.collection('users').get();
  }).then(function(snap) {
    var line = "Email verified: <span class='ok'>YES</span>";
    out.innerHTML =
      "Signed in: " + u.email + "\nUID: " + u.uid + "\n" + line + "\n\n" +
      "Owner permissions: <span class='ok'>WORKING</span>\n" +
      "Users list read allowed — " + snap.size + " user record(s) visible.\n\n" +
      "Tell Cherish: Owner permissions are working.";
  }).catch(function(e) {
    out.innerHTML =
      "Signed in: " + u.email + "\nUID: " + u.uid + "\n" +
      "Email verified: <span class='ok'>YES</span>\n\n" +
      "Owner permissions: <span class='bad'>DENIED</span>\n" +
      "Users list read was refused (" + e.code + ").\n\n" +
      "Tell Cherish exactly this — do not retry.";
  });
}
document.getElementById('signin').onclick = function() {
  out.textContent = "Signing in…";
  auth.signInWithEmailAndPassword(
    document.getElementById('email').value.trim(),
    document.getElementById('password').value
  ).then(show).catch(function(e) {
    out.textContent = "Sign-in failed: " + e.code + "\n" + e.message;
  });
};
sv.onclick = function() {
  var u = auth.currentUser; if (!u) return;
  u.sendEmailVerification().then(function() {
    out.textContent = "Verification email sent to " + u.email + ".\nCheck Gmail (and spam) and click the link, then tap 'Refresh my status'.";
  }).catch(function(e) { out.textContent = "Could not send: " + e.message; });
};
rf.onclick = function() {
  var u = auth.currentUser; if (!u) return;
  u.reload().then(show).catch(function(e) { out.textContent = "Refresh failed: " + e.message; });
};
document.getElementById('sendtest').onclick = function() {
  var email = document.getElementById('email').value.trim();
  out.textContent = "Sending test email…";
  auth.sendPasswordResetEmail(email).then(function() {
    out.textContent = "Test email sent to " + email + ".\nCheck whether it landed in your INBOX or in spam, and tell Cherish which one.\nYour password does NOT change unless you click the link in the email and complete it — just check where it landed.";
  }).catch(function(e) { out.textContent = "Test email failed: " + e.code + "\n" + e.message; });
};
auth.onAuthStateChanged(show);
</script>
</body>
</html>
