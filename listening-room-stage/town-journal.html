<script>
(()=>{'use strict';
const q=id=>document.getElementById(id),page=q('page'),paper=q('paper');
const foundingTop="\u003cp\u003e\u003cstrong\u003eThe TSCMS Town Journal\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBeing a true record of our town — what was heard, what was built, and how the station grew, kept in the order it happened, newest first.\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e\n\u003cp\u003e\u003cstrong\u003eHeard \u0026amp; Built — The Founding Entry\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBrenda Carraway\u003c/strong\u003e said, of the dice game on our homepage:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u0026quot;Absolutely love and I don't know why I had so much fun with the dice. Thank you, I've got a lot to learn.\u0026quot;\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eBrenda was the first to tell us, in so many words, what Dicey Discovery \u003cem\u003efelt\u003c/em\u003e like from a listener's chair — pure fun, and a standing invitation to learn more. We took her at her word. The dice got real rolling cards on the homepage: every roll lands on a member's song post, and one tap carries you straight to it. The counter behind the cards was taught to count honestly, so the fun she felt is now a number we can point to — 150 rolls in a week, and counting.\u003c/p\u003e\n\u003cp\u003eThat is why this page stands first, and why it always will. This journal exists because a member spoke up and the town built something from it. Brenda spoke first.\u003c/p\u003e\n";
const foundingTail="\u003cp\u003e\u003cem\u003eHeard from: Brenda Carraway · Built by: Clara \u0026amp; Cherish · Verified by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e(Turn the page — the town's construction journal follows, newest first.)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e\n";
const entrySource=[{"date": "October 22, 2026","title": "The Terms Got a Page of Their Own","content": "When the Drive-In opened, its rules lived where they could fit — a stretch of writing on the Videos page, doing its job, but easy to miss and hard for a member to keep.\n\nTonight those rules got a page of their own. The Drive-In submission terms now stand on one clean page that a member can print or save: what to send, where to send it, what happens after you send it, and what you are agreeing to — Version 1, dated October 22, 2026, in big readable type. The door to it stands on the Drive-In page itself: Read the submission terms — print or save a copy.\n\nOne rule on that page is newer than the Drive-In. Our first video was too big for an email attachment, so it arrived as a Google Drive link — and Fudgie ruled that a Drive link to the actual video file counts, so long as we can download it and check it is a real video file. That ruling is written into the terms now, where anyone can read it before they send. Suno and YouTube links still never count.\n\n*Built by: Clara · Finished and verified by: Cherish · Published on Fudgie\'s word (Oct 22)*\n\n---","body_html": "\u003cp\u003eWhen the Drive-In opened, its rules lived where they could fit — a stretch of writing on the Videos page, doing its job, but easy to miss and hard for a member to keep.\u003c/p\u003e\n\u003cp\u003eTonight those rules got a page of their own. The Drive-In submission terms now stand on one clean page that a member can print or save: what to send, where to send it, what happens after you send it, and what you are agreeing to — Version 1, dated October 22, 2026, in big readable type. The door to it stands on the Drive-In page itself: Read the submission terms — print or save a copy.\u003c/p\u003e\n\u003cp\u003eOne rule on that page is newer than the Drive-In. Our first video was too big for an email attachment, so it arrived as a Google Drive link — and Fudgie ruled that a Drive link to the actual video file counts, so long as we can download it and check it is a real video file. That ruling is written into the terms now, where anyone can read it before they send. Suno and YouTube links still never count.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Finished and verified by: Cherish · Published on Fudgie\'s word (Oct 22)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e","wordCount": 207}, {"date": "October 22, 2026", "title": "Words Big Enough to Read", "content": "Some of the smallest writing on the station's pages was very small indeed — little labels and buttons down at nine or ten letters tall, the kind you squint at. For a town with plenty of readers who'd rather not squint, that was worth fixing proper.\n\nSo tonight the small writing got a floor under it: nothing on the public pages sits below a readable size anymore. And for folks who want more, there's now a Larger Text button. Tap it and the smaller writing steps up a size and gains just a touch of boldness — a whisper of extra weight Fudgie tested on his own phone and approved exactly as it stands — while the big headings stay put, so nothing shoves or spills. The button remembers you, too: turn it on once and it stays on when you come back.\n\nIt was checked three ways before it opened: Clara's tests, Cherish's independent check of the exact build, and Fudgie's own phone, which had the final say.\n\n*Built by: Clara · Tested and approved by: Fudgie (his phone had the last word) · Verified live by: Cherish (Oct 22)*\n\n---", "body_html": "\u003cp\u003eSome of the smallest writing on the station's pages was very small indeed — little labels and buttons down at nine or ten letters tall, the kind you squint at. For a town with plenty of readers who'd rather not squint, that was worth fixing proper.\u003c/p\u003e\n\u003cp\u003eSo tonight the small writing got a floor under it: nothing on the public pages sits below a readable size anymore. And for folks who want more, there's now a Larger Text button. Tap it and the smaller writing steps up a size and gains just a touch of boldness — a whisper of extra weight Fudgie tested on his own phone and approved exactly as it stands — while the big headings stay put, so nothing shoves or spills. The button remembers you, too: turn it on once and it stays on when you come back.\u003c/p\u003e\n\u003cp\u003eIt was checked three ways before it opened: Clara's tests, Cherish's independent check of the exact build, and Fudgie's own phone, which had the final say.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Tested and approved by: Fudgie (his phone had the last word) · Verified live by: Cherish (Oct 22)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 192}, {"date": "October 22, 2026", "title": "The Night the Radio Got Its Voice Back", "content": "An honest entry, in this journal's tradition: some of the songs in the station's weekly radio mix couldn't actually play. They were sealed files — they looked like songs, they had names and singers, but no player anywhere could open them. Press play and you'd hear silence, and a listener would think the station was broken. There were thirty of them, in a mix of about a hundred and twenty. Near a quarter of the radio was dead air, and nobody knew, because the songs had never been tested one by one.\n\nThey have been now. Every song in the mix was downloaded and tested the slow way, and the sealed ones were taken out. The mix that plays tonight holds 95 songs, and every single one of them plays. And so it can't quietly happen again, the radio's builder now tests every new song before that song is allowed into the mix — a song that doesn't play doesn't get in, same as the finding shelf next door.\n\n*Found by: Cherish, following the Search recount · Approved by: Fudgie · Fixed and verified live by: Cherish (every song tested; Oct 22)*\n\n---", "body_html": "\u003cp\u003eAn honest entry, in this journal's tradition: some of the songs in the station's weekly radio mix couldn't actually play. They were sealed files — they looked like songs, they had names and singers, but no player anywhere could open them. Press play and you'd hear silence, and a listener would think the station was broken. There were thirty of them, in a mix of about a hundred and twenty. Near a quarter of the radio was dead air, and nobody knew, because the songs had never been tested one by one.\u003c/p\u003e\n\u003cp\u003eThey have been now. Every song in the mix was downloaded and tested the slow way, and the sealed ones were taken out. The mix that plays tonight holds 95 songs, and every single one of them plays. And so it can't quietly happen again, the radio's builder now tests every new song before that song is allowed into the mix — a song that doesn't play doesn't get in, same as the finding shelf next door.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eFound by: Cherish, following the Search recount · Approved by: Fudgie · Fixed and verified live by: Cherish (every song tested; Oct 22)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 196}, {"date": "October 22, 2026", "title": "Now You Can Find That Song", "content": "Somebody would say, \"play that one about the river, the one from last week,\" and until today the honest answer was: scroll and hope. Tonight the station got its finding shelf. Type a singer's name or a piece of a title into Search, and it looks through the station's saved songs and brings back every match it has — and every song it brings back plays, because every single one was tested first.\n\nThe label on the shelf says plainly what it holds: verified songs from three saved station weeks, October 7 to 21. More weeks join as they're saved. What it doesn't hold, it doesn't pretend to.\n\nOne honest note, in this page's tradition: the first count we announced was wrong. It was read off a check that hadn't finished running, and for a spell the number going around was 375 when the true count was 288. So the count was done over, song by song, the slow way — and 87 songs that couldn't actually play were taken off the shelf instead of being counted anyway. 288 is the honest number, and it's the one on the door.\n\n*Raised by: Fudgie · Built by: Clara · Counted and verified by: Cherish (every song tested; live check Oct 22)*\n\n---", "body_html": "\u003cp\u003eSomebody would say, \u0026quot;play that one about the river, the one from last week,\u0026quot; and until today the honest answer was: scroll and hope. Tonight the station got its finding shelf. Type a singer's name or a piece of a title into Search, and it looks through the station's saved songs and brings back every match it has — and every song it brings back plays, because every single one was tested first.\u003c/p\u003e\n\u003cp\u003eThe label on the shelf says plainly what it holds: verified songs from three saved station weeks, October 7 to 21. More weeks join as they're saved. What it doesn't hold, it doesn't pretend to.\u003c/p\u003e\n\u003cp\u003eOne honest note, in this page's tradition: the first count we announced was wrong. It was read off a check that hadn't finished running, and for a spell the number going around was 375 when the true count was 288. So the count was done over, song by song, the slow way — and 87 songs that couldn't actually play were taken off the shelf instead of being counted anyway. 288 is the honest number, and it's the one on the door.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRaised by: Fudgie · Built by: Clara · Counted and verified by: Cherish (every song tested; live check Oct 22)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 215}, {"date": "October 22, 2026", "title": "The Room Learned New Ways In", "content": "Not everybody works a computer the same way. Some of our team steer by keyboard instead of a mouse; some listen to the screen read aloud instead of reading it themselves. Until today, parts of the Control Room only answered to a mouse — the big panels wouldn't open, and the little boxes beside the waiting songs couldn't be reached at all.\n\nNow the room answers to more hands. Every panel's header is a true button that opens and closes from the keyboard, and says whether it's open or shut. The song boxes can be tabbed to like anything else on the page, wearing a bright gold ring so you always know where you stand. Shortcut links up top — *Jump to* — carry you straight to the panel you want. Buttons are sized for real fingers now, and when the song queue changes size, the room says so out loud for anyone listening.\n\nNothing about the work itself changed — same songs, same order, same queue. The room just learned new ways in, so more of the team can get to the work.\n\nOne honest note, in this page's tradition: we have tested the keyboard thoroughly, in the live room, but we have not yet listened to the room through a screen reader start to finish. That listen is on the list, and this journal will say so when it's done.\n\n*Raised by: Clara's Control Room audit · Built by: Clara · Verified by: Cherish (keyboard walk, live room) \u0026 Fudgie's phone*\n\n---", "body_html": "\u003cp\u003eNot everybody works a computer the same way. Some of our team steer by keyboard instead of a mouse; some listen to the screen read aloud instead of reading it themselves. Until today, parts of the Control Room only answered to a mouse — the big panels wouldn't open, and the little boxes beside the waiting songs couldn't be reached at all.\u003c/p\u003e\n\u003cp\u003eNow the room answers to more hands. Every panel's header is a true button that opens and closes from the keyboard, and says whether it's open or shut. The song boxes can be tabbed to like anything else on the page, wearing a bright gold ring so you always know where you stand. Shortcut links up top — \u003cem\u003eJump to\u003c/em\u003e — carry you straight to the panel you want. Buttons are sized for real fingers now, and when the song queue changes size, the room says so out loud for anyone listening.\u003c/p\u003e\n\u003cp\u003eNothing about the work itself changed — same songs, same order, same queue. The room just learned new ways in, so more of the team can get to the work.\u003c/p\u003e\n\u003cp\u003eOne honest note, in this page's tradition: we have tested the keyboard thoroughly, in the live room, but we have not yet listened to the room through a screen reader start to finish. That listen is on the list, and this journal will say so when it's done.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRaised by: Clara's Control Room audit · Built by: Clara · Verified by: Cherish (keyboard walk, live room) \u0026amp; Fudgie's phone\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 254}, {"date": "October 22, 2026", "title": "A Way Home From the Control Room", "content": "A funny thing happened as the station grew: once a team member signed in to the Control Room, the only door out was Sign Out. To look at the public homepage, you had to log yourself clean out of the station first.\n\nFudgie found it on his own phone and named it plainly. Now the room has a proper front step: **Return to Public Homepage**, sitting beside Sign Out at the top of the room, and a twin at the very bottom for anyone who has scrolled the whole way down. It is an ordinary link and nothing more — stepping home never signs you out, and we checked that by hand before we wrote a word of this.\n\n*Raised by: Fudgie · Built by: Clara · Verified by: Cherish (live click-through, Oct 22)*\n\n---", "body_html": "\u003cp\u003eA funny thing happened as the station grew: once a team member signed in to the Control Room, the only door out was Sign Out. To look at the public homepage, you had to log yourself clean out of the station first.\u003c/p\u003e\n\u003cp\u003eFudgie found it on his own phone and named it plainly. Now the room has a proper front step: \u003cstrong\u003eReturn to Public Homepage\u003c/strong\u003e, sitting beside Sign Out at the top of the room, and a twin at the very bottom for anyone who has scrolled the whole way down. It is an ordinary link and nothing more — stepping home never signs you out, and we checked that by hand before we wrote a word of this.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRaised by: Fudgie · Built by: Clara · Verified by: Cherish (live click-through, Oct 22)\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 131}, {"date": "October 22, 2026", "title": "The Room That Learned to Say \"Not Verified\"", "content": "Some of the dials in our Control Room used to sound more certain than they were. One claimed the town's fan engagement was \"live.\" Another stamped everything \"OK\" — though nothing was actually checking, moment to moment.\n\nSo we taught the room to tell the truth in plain print. Anything the station cannot verify now says **Not verified**. The numbers that *are* real carry their dates on their sleeves — the dice counter in the room shows when its count was taken, and the waiting-post list says \"7 days\" instead of hiding behind hours and decimals.\n\nWe'd rather show you an honest *not verified* than a confident guess. (And in the spirit of this page: the dice counter's first appearance in the room sat empty for an hour that same morning, for a reason hiding in the order the page's own instructions load. We found it, fixed it the same day, and watched the real numbers land. The record would be poorer without that part.)\n\n*Built by: Clara (with Clara's Work on the repair) · Verified by: Cherish*\n\n---", "body_html": "\u003cp\u003eSome of the dials in our Control Room used to sound more certain than they were. One claimed the town's fan engagement was \u0026quot;live.\u0026quot; Another stamped everything \u0026quot;OK\u0026quot; — though nothing was actually checking, moment to moment.\u003c/p\u003e\n\u003cp\u003eSo we taught the room to tell the truth in plain print. Anything the station cannot verify now says \u003cstrong\u003eNot verified\u003c/strong\u003e. The numbers that \u003cem\u003eare\u003c/em\u003e real carry their dates on their sleeves — the dice counter in the room shows when its count was taken, and the waiting-post list says \u0026quot;7 days\u0026quot; instead of hiding behind hours and decimals.\u003c/p\u003e\n\u003cp\u003eWe'd rather show you an honest \u003cem\u003enot verified\u003c/em\u003e than a confident guess. (And in the spirit of this page: the dice counter's first appearance in the room sat empty for an hour that same morning, for a reason hiding in the order the page's own instructions load. We found it, fixed it the same day, and watched the real numbers land. The record would be poorer without that part.)\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara (with Clara's Work on the repair) · Verified by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 180}, {"date": "October 22, 2026", "title": "Plain Words on the Doors, and an Inbox That Folds", "content": "The staff sign-in page used to make you guess which door was yours. It speaks plainly now: one door is *Temporary PIN Access* for the shared team PIN, the other is *Personal Admin Sign In* for your own login, and a single line explains how joining works — make your login, verify your email, wait for Fudgie's OK. Nobody gets in without it.\n\nThe Feedback button explains itself, too: it opens your email app, and nothing reaches us until you tap Send — the box says so, and offers our address outright for anyone with no email app set up.\n\nAnd in the approval room, the approved team now folds into one tidy bar — *Approved Team — N so far* — so a new name waiting on Fudgie's OK can never drown under the ones already in.\n\n*Built by: Clara · Verified by: Cherish*\n\n---", "body_html": "\u003cp\u003eThe staff sign-in page used to make you guess which door was yours. It speaks plainly now: one door is \u003cem\u003eTemporary PIN Access\u003c/em\u003e for the shared team PIN, the other is \u003cem\u003ePersonal Admin Sign In\u003c/em\u003e for your own login, and a single line explains how joining works — make your login, verify your email, wait for Fudgie's OK. Nobody gets in without it.\u003c/p\u003e\n\u003cp\u003eThe Feedback button explains itself, too: it opens your email app, and nothing reaches us until you tap Send — the box says so, and offers our address outright for anyone with no email app set up.\u003c/p\u003e\n\u003cp\u003eAnd in the approval room, the approved team now folds into one tidy bar — \u003cem\u003eApproved Team — N so far\u003c/em\u003e — so a new name waiting on Fudgie's OK can never drown under the ones already in.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Verified by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 141}, {"date": "October 22, 2026", "title": "The Button That Asks Twice", "content": "One button in the Control Room could end a team member's access with a single tap. On a phone, in a hurry, that is a slip waiting to happen — and Fudgie said so, in those words, before it ever did.\n\nNow the first tap only *arms* the button: it turns red, names the very person it would remove — \"Tap again to REVOKE\" that name — and holds for about five seconds. Scroll, tap elsewhere, switch apps, and it quietly forgets. A slipped finger can't fire it anymore.\n\nSmall thing. The kind of small thing a town does on purpose.\n\n*Raised by: Fudgie · Built by: Clara · Verified by: Cherish*\n\n---", "body_html": "\u003cp\u003eOne button in the Control Room could end a team member's access with a single tap. On a phone, in a hurry, that is a slip waiting to happen — and Fudgie said so, in those words, before it ever did.\u003c/p\u003e\n\u003cp\u003eNow the first tap only \u003cem\u003earms\u003c/em\u003e the button: it turns red, names the very person it would remove — \u0026quot;Tap again to REVOKE\u0026quot; that name — and holds for about five seconds. Scroll, tap elsewhere, switch apps, and it quietly forgets. A slipped finger can't fire it anymore.\u003c/p\u003e\n\u003cp\u003eSmall thing. The kind of small thing a town does on purpose.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRaised by: Fudgie · Built by: Clara · Verified by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 109}, {"date": "October 22, 2026", "title": "The Counter That Counts Rolls, But Never Names", "content": "Behind the Dicey cards sits a tiny counting service that tallies every roll of the dice. It can tell us 150 rolls happened this week — but not who rolled a single one. It counts crowds, not people, and that is exactly why we chose it.\n\nThis week its numbers stuck at zero while the dice rolled on. The counting is fixed now — same privacy, honest numbers — and the room shows its work: the count carries the day it was taken, so nobody mistakes an old tally for a live one.\n\n*Built by: Clara · Rebuilt \u0026 verified by: Cherish*\n\n---", "body_html": "\u003cp\u003eBehind the Dicey cards sits a tiny counting service that tallies every roll of the dice. It can tell us 150 rolls happened this week — but not who rolled a single one. It counts crowds, not people, and that is exactly why we chose it.\u003c/p\u003e\n\u003cp\u003eThis week its numbers stuck at zero while the dice rolled on. The counting is fixed now — same privacy, honest numbers — and the room shows its work: the count carries the day it was taken, so nobody mistakes an old tally for a live one.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Rebuilt \u0026amp; verified by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 97}, {"date": "October 21, 2026", "title": "Our Moderators Got Their Own Keys", "content": "The team used to share one password among them, the way a shop might keep one key by the register. This week everybody got a key of their own: each moderator signs in as themselves, with their own name on the door, and Fudgie approves every single login personally.\n\nIf you see new names helping around the station, that's them — settling into their own keys.\n\n*Built by: Clara · Verified by: Cherish · Approvals: Fudgie, one by one*\n\n---", "body_html": "\u003cp\u003eThe team used to share one password among them, the way a shop might keep one key by the register. This week everybody got a key of their own: each moderator signs in as themselves, with their own name on the door, and Fudgie approves every single login personally.\u003c/p\u003e\n\u003cp\u003eIf you see new names helping around the station, that's them — settling into their own keys.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Verified by: Cherish · Approvals: Fudgie, one by one\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 77}, {"date": "October 21, 2026", "title": "Send Us Your Music Video", "content": "The Drive-In is open. If you've made a music video of your song, the Videos page walks you through sending the file in — the how-to stands right at the top now, no hunting, and the terms will soon have their own clean page you can print and keep.\n\nSend the video *file* itself — that part matters, and the page says why. When we've gathered about two hours of approved video, we'll light the big screen for a Monday Music Video Night.\n\n*Page by: Clara · Rules: Fudgie*\n\n---", "body_html": "\u003cp\u003eThe Drive-In is open. If you've made a music video of your song, the Videos page walks you through sending the file in — the how-to stands right at the top now, no hunting, and the terms will soon have their own clean page you can print and keep.\u003c/p\u003e\n\u003cp\u003eSend the video \u003cem\u003efile\u003c/em\u003e itself — that part matters, and the page says why. When we've gathered about two hours of approved video, we'll light the big screen for a Monday Music Video Night.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003ePage by: Clara · Rules: Fudgie\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 89}, {"date": "October 20, 2026", "title": "The Station Got a Front Door", "content": "tscmsradio.com opened its doors: Song of the Week, the day's songs, the Gamehouse, and Quick Jump — one tap to everywhere the station lives, including our Facebook group and YouTube channel.\n\nThis journal is part of that front door growing up. Everything since stands on this week.\n\n*Built by: Clara · Verified by: Cherish \u0026 Fudgie's phone*\n\n---", "body_html": "\u003cp\u003etscmsradio.com opened its doors: Song of the Week, the day's songs, the Gamehouse, and Quick Jump — one tap to everywhere the station lives, including our Facebook group and YouTube channel.\u003c/p\u003e\n\u003cp\u003eThis journal is part of that front door growing up. Everything since stands on this week.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBuilt by: Clara · Verified by: Cherish \u0026amp; Fudgie's phone\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 57}, {"date": "October 20, 2026", "title": "September's Spotlight", "content": "Our first Monthly Spotlight went up: **Breakout Star — Chris Bloy**, and **Top Hand — Matt Spencer**, whose posts got the whole group talking.\n\nOctober's honors are being counted now.\n\n*Counted by: Cherish*\n\n---", "body_html": "\u003cp\u003eOur first Monthly Spotlight went up: \u003cstrong\u003eBreakout Star — Chris Bloy\u003c/strong\u003e, and \u003cstrong\u003eTop Hand — Matt Spencer\u003c/strong\u003e, whose posts got the whole group talking.\u003c/p\u003e\n\u003cp\u003eOctober's honors are being counted now.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCounted by: Cherish\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 32}, {"date": "October 20, 2026", "title": "A Word for Our Sponsor", "content": "There's a little television on the homepage now for Dubby, the fine folks backing the station. Code **TSCMSLIVE** saves you 10%, and Lady Red — who fronts the deal — swears by the stuff.\n\nPlaying a song on the homepage pauses for no one, but the little TV is polite: start it, and the station's other music steps aside until you're done.\n\n---", "body_html": "\u003cp\u003eThere's a little television on the homepage now for Dubby, the fine folks backing the station. Code \u003cstrong\u003eTSCMSLIVE\u003c/strong\u003e saves you 10%, and Lady Red — who fronts the deal — swears by the stuff.\u003c/p\u003e\n\u003cp\u003ePlaying a song on the homepage pauses for no one, but the little TV is polite: start it, and the station's other music steps aside until you're done.\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 63}, {"date": "Through October 31, 2026", "title": "Halloween at the Front of the List", "content": "Twenty-one spooky-season songs from our own members are pinned at the front of the list until Halloween night, when they vanish back into the vault.\n\nGive them a listen while they're riding up front.\n\n*Compiled by: Cherish · All streams verified playing, Oct 20*\n\n---", "body_html": "\u003cp\u003eTwenty-one spooky-season songs from our own members are pinned at the front of the list until Halloween night, when they vanish back into the vault.\u003c/p\u003e\n\u003cp\u003eGive them a listen while they're riding up front.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCompiled by: Cherish · All streams verified playing, Oct 20\u003c/em\u003e\u003c/p\u003e\n\u003chr /\u003e", "wordCount": 44}];
// Append future verified entries at the start of entrySource after Cherish's Change Log review.
// Page count derives from source length; no placeholder/fake member is shipped.
function packEntries(items){
  const result=[];let chunk=[],units=0;
  for(const item of items){
    const n=item.content.length;
    if(chunk.length>0 && (chunk.length>=3 || units+n>1700)){result.push(chunk);chunk=[];units=0;}
    chunk.push(item);units+=n;
  }
  if(chunk.length)result.push(chunk);
  return result;
}
const article=item=>'<article class="journal-entry"><header><time>'+escapeHTML(item.date)+'</time></header><h2>'+escapeHTML(item.title)+'</h2><div class="journal-body">'+item.body_html+'</div></article>';
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const journalPages=packEntries(entrySource).map((chunk,i)=>
  '<div class="overline">The Town’s Construction Journal</div><h1>'+(i===0?'Town Ledger':'More From the Town')+'</h1>'+
  '<p class="journal-intro">'+(i===0?'The latest verified improvements, newest first.':'Continuing the town’s real record, in order.')+'</p>'+chunk.map(article).join('<div class="journal-separator"></div>')+
  '<img class="sketch-strip" src="town-journal-assets/sketch-town-strip.webp" alt="A town going from penciled sketches to colorful buildings" width="941" height="285"/>');
const founding=()=>`<div class="overline">Heard &amp; Built · Founding Entry #001</div><div class="entry-grid"><div class="story">${foundingTop}</div>
<figure class="store-figure"><picture><source media="(max-width: 770px)" srcset="town-journal-assets/dicey-storefront-phone-a.png" />
<img src="town-journal-assets/dicey-storefront-desktop.webp" width="834" height="1463" loading="eager" alt="Complete Dicey Discovery Western storefront, roof, large sign, porch, OPEN sign, wagon wheel, flowers and two dice" /></picture>
<figcaption>Dicey Discovery · Full storefront illustration</figcaption></figure></div>
<img class="sketch-strip" src="town-journal-assets/sketch-town-strip.webp" alt="Buildings progress from pencil plans to completed colorful storefronts" width="941" height="285" />
<div class="story">${foundingTail}</div><div class="teaser"><div class="section-kicker">✦ COMING UP NEXT ✦</div><h2>The Town’s Construction Journal</h2><p>Turn the page for the newest recorded changes.</p></div>`;
const sheets=[founding,...journalPages.map(content=>()=>content)];
let current=0,busy=false;
function render(){page.innerHTML=sheets[current]();q('previous').disabled=current===0;q('next').disabled=current===sheets.length-1;
 q('count').textContent='Page '+(current+1)+' of '+sheets.length;
 q('previous').textContent=current===1?'← Back to Brenda':'← Previous Page';
 q('next').textContent=current===sheets.length-1?'End of this volume':current===0?'Read the Town Journal →':'Continue the Town Journal →';
 page.setAttribute('aria-label',current===0?'Founding entry: Brenda Carraway':'Construction Journal, page '+current);
}
function turn(n){if(busy||n<0||n>=sheets.length)return;busy=true;paper.classList.remove('changing');void paper.offsetWidth;current=n;render();paper.classList.add('changing');
 window.setTimeout(()=>{paper.classList.remove('changing');busy=false},340);window.scrollTo({top:0,behavior:'instant'});page.focus({preventScroll:true});}
q('previous').addEventListener('click',()=>turn(current-1));q('next').addEventListener('click',()=>turn(current+1));
render();
})();
</script>
