name: Reject production Firebase identifiers in TEST staging
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  firebase-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce TEST Firebase configuration across every tracked stage
        run: node scripts/test-stage-firebase-isolation.cjs
